<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bold Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F4F1EC;
      --ink: #1A1A18;
      --ink-muted: #5C5A55;
      --ink-faint: #8A8780;
      --accent: #E85D04;
      --accent-dark: #C44D00;
      --surface: #FDFCFA;
      --border: #D9D4CB;
      --shadow: 3px 3px 0 #1A1A18;
      --radius: 2px;
      --sidebar-w: 220px;
      --font-display: 'Fraunces', Georgia, serif;
      --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
      --status-aberto: #2D6A4F;
      --status-atendimento: #1D4E89;
      --status-aguardando: #BC6C25;
      --status-resolvido: #5C5A55;
      --status-cancelado: #9B2226;
      --prio-alta: #9B2226;
      --prio-media: #BC6C25;
      --prio-baixa: #5C5A55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* ── Shell ── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--ink);
      color: var(--paper);
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .logo span { color: var(--accent); display: block; font-size: 0.75rem; font-family: var(--font-ui); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 0.25rem; }

    .nav { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
    .nav-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-faint); margin-bottom: 0.5rem; padding-left: 0.5rem; }
    .nav-btn {
      background: none; border: none; color: var(--paper);
      font-family: var(--font-ui); font-size: 0.875rem; font-weight: 500;
      padding: 0.6rem 0.75rem; text-align: left; cursor: pointer;
      border-radius: var(--radius); transition: background 0.15s;
      opacity: 0.7;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.08); opacity: 1; }
    .nav-btn.active { background: var(--accent); opacity: 1; }

    .mode-switch {
      display: flex; border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius); overflow: hidden;
    }
    .mode-btn {
      flex: 1; background: none; border: none; color: var(--paper);
      font-family: var(--font-ui); font-size: 0.75rem; font-weight: 600;
      padding: 0.5rem; cursor: pointer; opacity: 0.6; transition: all 0.15s;
    }
    .mode-btn.active { background: var(--paper); color: var(--ink); opacity: 1; }

    .sidebar-footer { font-size: 0.7rem; color: var(--ink-faint); line-height: 1.6; }
    .sidebar-footer button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: inherit; text-decoration: underline; padding: 0; }

    /* ── Main ── */
    .main { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      padding: 1rem 1.5rem;
      border-bottom: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      background: var(--surface);
    }
    .topbar h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; }
    .topbar-meta { font-size: 0.8rem; color: var(--ink-muted); }

    .workspace {
      flex: 1; display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 0;
    }

    .panel-list {
      border-right: 2px solid var(--ink);
      overflow-y: auto;
      background: var(--surface);
    }

    .panel-detail {
      overflow-y: auto;
      padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    .panel-list-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--surface); z-index: 2;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    .filters select, .filters input {
      font-family: var(--font-ui); font-size: 0.8rem;
      padding: 0.35rem 0.5rem; border: 1px solid var(--border);
      background: var(--paper); border-radius: var(--radius);
    }
    .filters input { flex: 1; min-width: 120px; }

    /* ── Ticket cards ── */
    .ticket-card {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .ticket-card:hover { background: var(--paper); }
    .ticket-card.selected { background: var(--paper); border-left: 3px solid var(--accent); }

    .ticket-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.35rem; }
    .protocol { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
    .ticket-card h3 { font-size: 0.9rem; font-weight: 600; line-height: 1.3; margin-bottom: 0.5rem; }
    .ticket-card-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .time-ago { font-size: 0.7rem; color: var(--ink-faint); margin-left: auto; }

    /* ── Badges ── */
    .badge {
      display: inline-block; font-size: 0.65rem; font-weight: 600;
      padding: 0.15rem 0.45rem; border-radius: var(--radius);
      text-transform: uppercase; letter-spacing: 0.05em;
      border: 1px solid currentColor;
    }
    .badge-status-aberto { color: var(--status-aberto); }
    .badge-status-em_atendimento { color: var(--status-atendimento); }
    .badge-status-aguardando_cliente { color: var(--status-aguardando); }
    .badge-status-resolvido { color: var(--status-resolvido); }
    .badge-status-cancelado { color: var(--status-cancelado); }
    .badge-prio-alta { color: var(--prio-alta); }
    .badge-prio-media { color: var(--prio-media); }
    .badge-prio-baixa { color: var(--prio-baixa); }

    /* ── Forms ── */
    .form-panel {
      max-width: 520px;
      padding: 2rem;
      margin: auto;
      width: 100%;
    }
    .form-panel h2 { font-family: var(--font-display); font-size: 1.75rem; margin-bottom: 0.35rem; }
    .form-panel .subtitle { color: var(--ink-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }

    .field { margin-bottom: 1.1rem; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; color: var(--ink-muted); }
    .field input, .field select, .field textarea {
      width: 100%; font-family: var(--font-ui); font-size: 0.9rem;
      padding: 0.6rem 0.75rem; border: 2px solid var(--ink);
      background: var(--surface); border-radius: var(--radius);
      transition: box-shadow 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; box-shadow: var(--shadow);
    }
    .field textarea { min-height: 100px; resize: vertical; }

    .btn {
      font-family: var(--font-ui); font-size: 0.875rem; font-weight: 600;
      padding: 0.65rem 1.25rem; border: 2px solid var(--ink);
      background: var(--accent); color: var(--surface);
      cursor: pointer; border-radius: var(--radius);
      box-shadow: var(--shadow); transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: var(--shadow); }
    .btn-ghost { background: var(--surface); color: var(--ink); }
    .btn-danger { background: var(--status-cancelado); }
    .btn-sm { font-size: 0.8rem; padding: 0.45rem 0.85rem; }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }

    /* ── Detail view ── */
    .detail-header { border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .detail-header h2 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 0.5rem; }
    .detail-desc { font-size: 0.9rem; color: var(--ink-muted); line-height: 1.6; white-space: pre-wrap; }

    .detail-actions {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end;
      padding: 1rem; background: var(--surface); border: 2px solid var(--ink);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .detail-actions .field { margin: 0; flex: 1; min-width: 140px; }

    /* ── Timeline ── */
    .timeline { display: flex; flex-direction: column; gap: 0.75rem; flex: 1; }
    .timeline-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 0.25rem; }

    .msg {
      max-width: 78%; padding: 0.75rem 1rem;
      border-radius: var(--radius); font-size: 0.875rem; line-height: 1.55;
      position: relative;
    }
    .msg-sistema {
      align-self: center; max-width: 90%;
      background: transparent; border: 1px dashed var(--border);
      color: var(--ink-faint); font-size: 0.8rem; text-align: center;
      padding: 0.5rem 1rem;
    }
    .msg-agente {
      align-self: flex-start;
      background: var(--ink); color: var(--paper);
      border: 2px solid var(--ink);
    }
    .msg-cliente {
      align-self: flex-end;
      background: var(--surface); color: var(--ink);
      border: 2px solid var(--ink); box-shadow: var(--shadow);
    }
    .msg-meta { font-size: 0.65rem; opacity: 0.65; margin-top: 0.35rem; }

    .reply-box {
      margin-top: auto; padding-top: 1rem;
      border-top: 2px solid var(--ink);
    }
    .reply-box textarea { width: 100%; min-height: 72px; font-family: var(--font-ui); font-size: 0.9rem; padding: 0.6rem 0.75rem; border: 2px solid var(--ink); background: var(--surface); border-radius: var(--radius); resize: vertical; }
    .reply-box textarea:focus { outline: none; box-shadow: var(--shadow); }

    /* ── Empty / loading ── */
    .empty-state {
      padding: 3rem 2rem; text-align: center; color: var(--ink-muted);
    }
    .empty-state p { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--ink); }
    .empty-state small { font-size: 0.85rem; }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--paper) 50%, var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.2s infinite;
      border-radius: var(--radius); height: 60px; margin: 0.75rem 1.25rem;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Toast ── */
    .toasts {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000;
    }
    .toast {
      padding: 0.75rem 1.1rem; font-size: 0.85rem; font-weight: 500;
      border: 2px solid var(--ink); border-radius: var(--radius);
      box-shadow: var(--shadow); max-width: 360px;
      animation: slideIn 0.25s ease;
    }
    .toast-success { background: var(--status-aberto); color: var(--surface); }
    .toast-error { background: var(--status-cancelado); color: var(--surface); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(26,26,24,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 1rem;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border: 2px solid var(--ink);
      border-radius: var(--radius); box-shadow: 6px 6px 0 var(--ink);
      padding: 1.75rem; max-width: 440px; width: 100%;
    }
    .modal h3 { font-family: var(--font-display); font-size: 1.25rem; margin-bottom: 1rem; }
    .modal-note { font-size: 0.8rem; color: var(--ink-muted); margin-top: 1rem; line-height: 1.5; }

    .cliente-chip {
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; padding: 0.35rem 0.75rem;
      background: var(--paper); border: 1px solid var(--border);
      border-radius: var(--radius); margin-top: 0.5rem;
    }

    .full-panel { grid-column: 1 / -1; }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: relative; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 1rem; gap: 1rem; }
      .nav { flex-direction: row; flex-wrap: wrap; flex: none; }
      .nav-label { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .panel-list { max-height: 40vh; border-right: none; border-bottom: 2px solid var(--ink); }
      .panel-detail { display: none; }
      .panel-detail.visible { display: flex; }
      .panel-list.hidden-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">Bold<span>Support</span></div>
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="cliente">Cliente</button>
        <button class="mode-btn" data-mode="agente">Agente</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button type="button" id="btn-config">Configurar API</button><br>
        Protótipo Etapa 3
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Meu cadastro</h1>
          <div class="topbar-meta" id="page-subtitle"></div>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-refresh" style="display:none">Atualizar fila</button>
      </header>
      <div class="workspace" id="workspace"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <div class="modal-overlay hidden" id="modal-config">
    <div class="modal">
      <h3>Configuração da API</h3>
      <div class="field">
        <label>Base URL (n8n)</label>
        <input type="url" id="input-api-base" placeholder="https://dev.boldsolution.com.br/webhook">
      </div>
      <div class="btn-row">
        <button class="btn" id="btn-save-config">Salvar</button>
        <button class="btn btn-ghost" id="btn-close-config">Cancelar</button>
      </div>
      <p class="modal-note">Sirva este arquivo com <code>npx serve frontend</code>. Se o navegador bloquear requisições (CORS), a instância n8n precisa permitir a origem do seu servidor local.</p>
    </div>
  </div>

  <script>
    /* ── API Client ── */
    const TRANSITIONS = {
      aberto: ['em_atendimento', 'cancelado'],
      em_atendimento: ['aguardando_cliente', 'resolvido', 'cancelado'],
      aguardando_cliente: ['em_atendimento', 'resolvido', 'cancelado'],
      resolvido: [],
      cancelado: []
    };

    const STATUS_LABELS = {
      aberto: 'Aberto',
      em_atendimento: 'Em atendimento',
      aguardando_cliente: 'Aguardando cliente',
      resolvido: 'Resolvido',
      cancelado: 'Cancelado'
    };

    const PRIO_LABELS = { baixa: 'Baixa', media: 'Média', alta: 'Alta' };

    class ApiError extends Error {
      constructor(message, code, status) {
        super(message);
        this.code = code;
        this.status = status;
      }
    }

    const API = {
      get base() {
        return localStorage.getItem('bold_api_base') || 'https://dev.boldsolution.com.br/webhook';
      },
      set base(v) { localStorage.setItem('bold_api_base', v.replace(/\/$/, '')); },

      async request(url, { method = 'GET', body } = {}) {
        const opts = { method, headers: {} };
        if (body) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        let res;
        try {
          res = await fetch(url, opts);
        } catch {
          throw new ApiError('Não foi possível conectar à API. Verifique CORS e se os workflows estão ativos.', 'NETWORK_ERROR', 0);
        }
        let data;
        try { data = await res.json(); } catch { data = {}; }
        if (!res.ok) {
          throw new ApiError(data.erro || 'Erro desconhecido', data.codigo || 'ERRO', res.status);
        }
        return data;
      },

      clientes: {
        create(payload) {
          return API.request(`${API.base}/bold-post-clientes/clientes`, { method: 'POST', body: payload });
        },
        getById(id) {
          return API.request(`${API.base}/bold-get-cliente/clientes/${id}`);
        },
        remove(id) {
          return API.request(`${API.base}/bold-delete-cliente/clientes/remover/${id}`, { method: 'DELETE' });
        }
      },

      tickets: {
        create(payload) {
          return API.request(`${API.base}/bold-post-tickets/tickets`, { method: 'POST', body: payload });
        },
        listByStatus(status) {
          return API.request(`${API.base}/bold-get-tickets/tickets?status=${status}`);
        },
        listByPriority(prioridade) {
          return API.request(`${API.base}/bold-get-tickets/tickets?prioridade=${prioridade}`);
        },
        async listActive() {
          const statuses = ['aberto', 'em_atendimento', 'aguardando_cliente'];
          const results = await Promise.all(statuses.map(s => API.tickets.listByStatus(s).catch(() => ({ tickets: [] }))));
          const all = results.flatMap(r => r.tickets || []);
          all.sort((a, b) => new Date(b.atualizado_em) - new Date(a.atualizado_em));
          return all;
        },
        getById(id) {
          return API.request(`${API.base}/bold-get-ticket-id/tickets/${id}`);
        },
        updateStatus(id, status) {
          return API.request(`${API.base}/bold-patch-ticket-status/tickets/atualizar-status/${id}`, { method: 'PATCH', body: { status } });
        },
        addInteracao(id, tipo, mensagem) {
          return API.request(`${API.base}/bold-post-ticket-interacao/tickets/adicionar-interacao/${id}`, { method: 'POST', body: { tipo, mensagem } });
        },
        remove(id) {
          return API.request(`${API.base}/bold-delete-ticket/tickets/remover/${id}`, { method: 'DELETE' });
        }
      },

      getAllowedTransitions(status) {
        return TRANSITIONS[status] || [];
      }
    };

    /* ── State ── */
    const state = {
      mode: 'cliente',
      view: 'cadastro',
      tickets: [],
      selectedId: null,
      selectedTicket: null,
      loading: false,
      filterStatus: '',
      filterPrio: '',
      filterSearch: '',
      clienteId: localStorage.getItem('bold_cliente_id') || '',
      clienteNome: localStorage.getItem('bold_cliente_nome') || ''
    };

    const NAV_CLIENTE = [
      { id: 'cadastro', label: 'Meu cadastro' },
      { id: 'novo', label: 'Abrir chamado' },
      { id: 'acompanhar', label: 'Acompanhar' }
    ];

    const NAV_AGENTE = [
      { id: 'fila', label: 'Fila de chamados' }
    ];

    /* ── Utils ── */
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'agora';
      if (mins < 60) return `${mins}min`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h`;
      const days = Math.floor(hrs / 24);
      return `${days}d`;
    }

    function fmtDate(dateStr) {
      return new Date(dateStr).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function badgeStatus(s) {
      return `<span class="badge badge-status-${s}">${STATUS_LABELS[s] || s}</span>`;
    }

    function badgePrio(p) {
      return `<span class="badge badge-prio-${p}">${PRIO_LABELS[p] || p}</span>`;
    }

    function isUuid(str) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(str);
    }

    /* ── Render nav ── */
    function renderNav() {
      const items = state.mode === 'cliente' ? NAV_CLIENTE : NAV_AGENTE;
      document.getElementById('nav').innerHTML = `
        <div class="nav-label">${state.mode === 'cliente' ? 'Área do cliente' : 'Mesa de suporte'}</div>
        ${items.map(i => `<button class="nav-btn${state.view === i.id ? ' active' : ''}" data-view="${i.id}">${i.label}</button>`).join('')}
      `;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => { state.view = btn.dataset.view; state.selectedId = null; state.selectedTicket = null; render(); };
      });
    }

    /* ── Cliente: Cadastro ── */
    function renderCadastro() {
      document.getElementById('workspace').innerHTML = `
        <div class="full-panel form-panel">
          <h2>Quem está pedindo ajuda?</h2>
          <p class="subtitle">Precisamos dos seus dados para vincular o chamado. Só pedimos uma vez.</p>
          ${state.clienteId ? `<div class="cliente-chip">Cadastrado: <strong>${esc(state.clienteNome)}</strong> <button class="btn btn-ghost btn-sm" id="btn-clear-cliente">Trocar</button></div>` : ''}
          <form id="form-cadastro">
            <div class="field"><label>Nome completo</label><input name="nome" required placeholder="Maria Silva"></div>
            <div class="field"><label>E-mail</label><input name="email" type="email" required placeholder="maria@empresa.com"></div>
            <div class="field"><label>Telefone</label><input name="telefone" required placeholder="(11) 99999-0000"></div>
            <button type="submit" class="btn">${state.clienteId ? 'Atualizar cadastro' : 'Salvar e continuar'}</button>
          </form>
        </div>`;
      document.getElementById('form-cadastro').onsubmit = async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const data = await API.clientes.create({
            nome: fd.get('nome'), email: fd.get('email'), telefone: fd.get('telefone')
          });
          state.clienteId = data.id;
          state.clienteNome = data.nome;
          localStorage.setItem('bold_cliente_id', data.id);
          localStorage.setItem('bold_cliente_nome', data.nome);
          toast('Cadastro salvo. Pode abrir um chamado.');
          render();
        } catch (err) {
          toast(err.message, 'error');
        }
      };
      const clearBtn = document.getElementById('btn-clear-cliente');
      if (clearBtn) clearBtn.onclick = () => {
        state.clienteId = ''; state.clienteNome = '';
        localStorage.removeItem('bold_cliente_id');
        localStorage.removeItem('bold_cliente_nome');
        render();
      };
    }

    /* ── Cliente: Novo chamado ── */
    function renderNovo() {
      if (!state.clienteId) {
        document.getElementById('workspace').innerHTML = `<div class="full-panel empty-state"><p>Cadastre-se primeiro</p><small>Vá em "Meu cadastro" antes de abrir um chamado.</small></div>`;
        return;
      }
      document.getElementById('workspace').innerHTML = `
        <div class="full-panel form-panel">
          <h2>Descreva o problema</h2>
          <p class="subtitle">Quanto mais contexto, mais rápido resolvemos. Protocolo gerado automaticamente.</p>
          <form id="form-ticket">
            <div class="field"><label>Título</label><input name="titulo" required maxlength="200" placeholder="Ex: Não consigo acessar o painel"></div>
            <div class="field"><label>Descrição</label><textarea name="descricao" required placeholder="O que aconteceu? Quando começou? Já tentou algo?"></textarea></div>
            <div class="field"><label>Prioridade</label>
              <select name="prioridade">
                <option value="baixa">Baixa — posso esperar</option>
                <option value="media" selected>Média — atrapalha o trabalho</option>
                <option value="alta">Alta — sistema parado</option>
              </select>
            </div>
            <button type="submit" class="btn">Abrir chamado</button>
          </form>
        </div>`;
      document.getElementById('form-ticket').onsubmit = async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          const ticket = await API.tickets.create({
            cliente_id: state.clienteId,
            titulo: fd.get('titulo'),
            descricao: fd.get('descricao'),
            prioridade: fd.get('prioridade')
          });
          localStorage.setItem('bold_last_ticket', ticket.id);
          toast(`Chamado ${ticket.protocolo} aberto.`);
          state.view = 'acompanhar';
          state.selectedId = ticket.id;
          await loadTicketDetail(ticket.id);
          render();
        } catch (err) {
          toast(err.message, 'error');
        }
      };
    }

    /* ── Cliente: Acompanhar ── */
    function renderAcompanhar() {
      const lastId = localStorage.getItem('bold_last_ticket') || '';
      document.getElementById('workspace').innerHTML = `
        <div class="full-panel form-panel" style="max-width:680px">
          <h2>Acompanhar chamado</h2>
          <p class="subtitle">Cole o ID do chamado ou use o último aberto.</p>
          <form id="form-buscar" style="display:flex;gap:0.5rem;margin-bottom:1.5rem">
            <input name="ticket_id" id="input-ticket-id" placeholder="UUID do chamado" value="${esc(lastId)}" style="flex:1;padding:0.6rem 0.75rem;border:2px solid var(--ink);font-family:var(--font-ui)">
            <button type="submit" class="btn">Buscar</button>
          </form>
          <div id="ticket-detail-area"></div>
        </div>`;
      document.getElementById('form-buscar').onsubmit = async e => {
        e.preventDefault();
        const id = document.getElementById('input-ticket-id').value.trim();
        if (!isUuid(id)) { toast('ID inválido', 'error'); return; }
        await loadTicketDetail(id);
        renderTicketDetailArea('cliente');
      };
      if (state.selectedTicket) renderTicketDetailArea('cliente');
    }

    /* ── Agente: Fila ── */
    async function loadAgentQueue() {
      state.loading = true;
      renderAgentFila();
      try {
        state.tickets = await API.tickets.listActive();
      } catch (err) {
        toast(err.message, 'error');
        state.tickets = [];
      }
      state.loading = false;
      renderAgentFila();
    }

    function filteredTickets() {
      return state.tickets.filter(t => {
        if (state.filterStatus && t.status !== state.filterStatus) return false;
        if (state.filterPrio && t.prioridade !== state.filterPrio) return false;
        if (state.filterSearch) {
          const q = state.filterSearch.toLowerCase();
          if (!t.titulo.toLowerCase().includes(q) && !t.protocolo.toLowerCase().includes(q)) return false;
        }
        return true;
      });
    }

    function renderAgentFila() {
      const tickets = filteredTickets();
      document.getElementById('workspace').innerHTML = `
        <div class="panel-list" id="panel-list">
          <div class="panel-list-header">
            <strong style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em">${state.loading ? 'Carregando...' : `${tickets.length} chamado(s)`}</strong>
            <div class="filters">
              <select id="filter-status"><option value="">Todos status</option>${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}"${state.filterStatus===k?' selected':''}>${v}</option>`).join('')}</select>
              <select id="filter-prio"><option value="">Todas prioridades</option>${Object.entries(PRIO_LABELS).map(([k,v]) => `<option value="${k}"${state.filterPrio===k?' selected':''}>${v}</option>`).join('')}</select>
              <input id="filter-search" placeholder="Buscar..." value="${esc(state.filterSearch)}">
            </div>
          </div>
          ${state.loading ? '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>' :
            tickets.length === 0 ? '<div class="empty-state"><p>Fila vazia</p><small>Nenhum chamado ativo no momento. Bom sinal?</small></div>' :
            tickets.map(t => ticketCardHtml(t)).join('')}
        </div>
        <div class="panel-detail${state.selectedTicket ? ' visible' : ''}" id="panel-detail">
          ${state.selectedTicket ? renderDetailContent('agente') : '<div class="empty-state"><p>Selecione um chamado</p><small>Clique na lista ao lado para ver detalhes e responder.</small></div>'}
        </div>`;

      document.getElementById('filter-status').onchange = e => { state.filterStatus = e.target.value; renderAgentFila(); };
      document.getElementById('filter-prio').onchange = e => { state.filterPrio = e.target.value; renderAgentFila(); };
      document.getElementById('filter-search').oninput = e => { state.filterSearch = e.target.value; renderAgentFila(); };

      document.querySelectorAll('.ticket-card').forEach(card => {
        card.onclick = async () => {
          state.selectedId = card.dataset.id;
          await loadTicketDetail(card.dataset.id);
          renderAgentFila();
        };
      });

      bindDetailActions('agente');
    }

    function ticketCardHtml(t) {
      const sel = state.selectedId === t.id ? ' selected' : '';
      return `<div class="ticket-card${sel}" data-id="${t.id}">
        <div class="ticket-card-top"><span class="protocol">${esc(t.protocolo)}</span><span class="time-ago">${timeAgo(t.atualizado_em)}</span></div>
        <h3>${esc(t.titulo)}</h3>
        <div class="ticket-card-meta">${badgeStatus(t.status)} ${badgePrio(t.prioridade)}</div>
      </div>`;
    }

    async function loadTicketDetail(id) {
      try {
        state.selectedTicket = await API.tickets.getById(id);
        state.selectedId = id;
        localStorage.setItem('bold_last_ticket', id);
      } catch (err) {
        toast(err.message, 'error');
        state.selectedTicket = null;
      }
    }

    function renderTicketDetailArea(role) {
      const area = document.getElementById('ticket-detail-area');
      if (!area) return;
      area.innerHTML = state.selectedTicket ? renderDetailContent(role) : '';
      bindDetailActions(role);
    }

    function renderDetailContent(role) {
      const t = state.selectedTicket;
      if (!t) return '';
      const interacoes = (t.interacoes || []).map(i => {
        const cls = `msg msg-${i.tipo}`;
        return `<div class="${cls}"><div>${esc(i.mensagem)}</div><div class="msg-meta">${i.tipo} · ${fmtDate(i.criado_em)}</div></div>`;
      }).join('');

      const allowed = API.getAllowedTransitions(t.status);
      const statusSelect = role === 'agente' && allowed.length > 0 ? `
        <div class="detail-actions">
          <div class="field"><label>Mudar status</label>
            <select id="select-status">${allowed.map(s => `<option value="${s}">${STATUS_LABELS[s]}</option>`).join('')}</select>
          </div>
          <button class="btn btn-sm" id="btn-status">Aplicar</button>
          <button class="btn btn-danger btn-sm" id="btn-delete-ticket">Excluir</button>
        </div>` : role === 'agente' ? `<div class="detail-actions"><span style="font-size:0.85rem;color:var(--ink-muted)">Status terminal — sem transições.</span><button class="btn btn-danger btn-sm" id="btn-delete-ticket">Excluir</button></div>` : '';

      return `
        <div class="detail-header">
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">${badgeStatus(t.status)} ${badgePrio(t.prioridade)} <span class="protocol">${esc(t.protocolo)}</span></div>
          <h2>${esc(t.titulo)}</h2>
          <p class="detail-desc">${esc(t.descricao)}</p>
          <div style="font-size:0.75rem;color:var(--ink-faint);margin-top:0.5rem">Aberto ${fmtDate(t.criado_em)} · Atualizado ${fmtDate(t.atualizado_em)}</div>
        </div>
        ${statusSelect}
        <div class="timeline-label">Histórico</div>
        <div class="timeline">${interacoes}</div>
        ${!['resolvido','cancelado'].includes(t.status) ? `
        <div class="reply-box">
          <textarea id="reply-msg" placeholder="${role === 'agente' ? 'Sua resposta ao cliente...' : 'Adicionar informação ao chamado...'}"></textarea>
          <div class="btn-row"><button class="btn btn-sm" id="btn-reply">Enviar</button></div>
        </div>` : '<p style="font-size:0.85rem;color:var(--ink-muted)">Este chamado está encerrado.</p>'}`;
    }

    function bindDetailActions(role) {
      const btnStatus = document.getElementById('btn-status');
      if (btnStatus) btnStatus.onclick = async () => {
        const status = document.getElementById('select-status').value;
        try {
          await API.tickets.updateStatus(state.selectedId, status);
          toast('Status atualizado.');
          await loadTicketDetail(state.selectedId);
          if (role === 'agente') await loadAgentQueue();
          else renderTicketDetailArea(role);
        } catch (err) { toast(err.message, 'error'); }
      };

      const btnDelete = document.getElementById('btn-delete-ticket');
      if (btnDelete) btnDelete.onclick = async () => {
        if (!confirm('Excluir este chamado permanentemente?')) return;
        try {
          await API.tickets.remove(state.selectedId);
          toast('Chamado excluído.');
          state.selectedId = null; state.selectedTicket = null;
          await loadAgentQueue();
        } catch (err) { toast(err.message, 'error'); }
      };

      const btnReply = document.getElementById('btn-reply');
      if (btnReply) btnReply.onclick = async () => {
        const msg = document.getElementById('reply-msg').value.trim();
        if (!msg) { toast('Digite uma mensagem', 'error'); return; }
        const tipo = role === 'agente' ? 'agente' : 'cliente';
        try {
          await API.tickets.addInteracao(state.selectedId, tipo, msg);
          toast('Mensagem enviada.');
          await loadTicketDetail(state.selectedId);
          if (role === 'agente') renderAgentFila();
          else renderTicketDetailArea(role);
        } catch (err) { toast(err.message, 'error'); }
      };
    }

    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    const TITLES = {
      cadastro: ['Meu cadastro', 'Dados para vincular chamados'],
      novo: ['Abrir chamado', 'Descreva o que precisa'],
      acompanhar: ['Acompanhar', 'Veja o histórico e responda'],
      fila: ['Fila de chamados', 'Mesa de suporte Bold']
    };

    function render() {
      renderNav();
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));

      const [title, sub] = TITLES[state.view] || ['Bold Support', ''];
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-subtitle').textContent = sub;
      document.getElementById('btn-refresh').style.display = state.mode === 'agente' ? '' : 'none';

      if (state.mode === 'cliente') {
        if (state.view === 'cadastro') renderCadastro();
        else if (state.view === 'novo') renderNovo();
        else if (state.view === 'acompanhar') renderAcompanhar();
      } else {
        if (state.view === 'fila') {
          if (!state.tickets.length && !state.loading) loadAgentQueue();
          else renderAgentFila();
        }
      }
    }

    /* ── Events ── */
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.onclick = () => {
        state.mode = btn.dataset.mode;
        state.view = state.mode === 'cliente' ? 'cadastro' : 'fila';
        state.selectedId = null; state.selectedTicket = null; state.tickets = [];
        render();
        if (state.mode === 'agente') loadAgentQueue();
      };
    });

    document.getElementById('btn-refresh').onclick = () => loadAgentQueue();

    document.getElementById('btn-config').onclick = () => {
      document.getElementById('input-api-base').value = API.base;
      document.getElementById('modal-config').classList.remove('hidden');
    };
    document.getElementById('btn-close-config').onclick = () => document.getElementById('modal-config').classList.add('hidden');
    document.getElementById('btn-save-config').onclick = () => {
      API.base = document.getElementById('input-api-base').value;
      document.getElementById('modal-config').classList.add('hidden');
      toast('URL da API salva.');
    };

    render();
  </script>
</body>
</html>
